org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# Left off on purpose: the Compose Multiplatform and Room KSP plugins are not
# configuration-cache clean yet, and the failure mode is a confusing build error
# rather than a slow build. Turn it on once both are.
org.gradle.configuration-cache=false

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
kotlin.mpp.androidSourceSetLayoutVersion=2
kotlin.mpp.enableCInteropCommonization=true
